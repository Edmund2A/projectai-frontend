<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProjectAI — History</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1a1a1a; background: #f7f6fe; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem 0; transition: width 0.25s ease; overflow: hidden; flex-shrink: 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 50; }
    .sidebar.collapsed { width: 60px; }
    .sidebar-top { padding: 0 1rem 1.2rem; border-bottom: 1px solid #e8e8e8; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
    .sidebar-logo { font-size: 1.2rem; font-weight: 700; color: #534AB7; white-space: nowrap; transition: opacity 0.15s; text-decoration: none; }
    .sidebar.collapsed .sidebar-logo { opacity: 0; width: 0; overflow: hidden; }
    .toggle-btn { min-width: 28px; height: 28px; border-radius: 6px; border: 1px solid #e8e8e8; background: #f7f6fe; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toggle-btn svg { width: 14px; height: 14px; stroke: #666; fill: none; stroke-width: 2; transition: transform 0.2s; }
    .sidebar.collapsed .toggle-btn svg { transform: rotate(180deg); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 0.6rem; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.7rem; border-radius: 8px; font-size: 0.88rem; color: #555; cursor: pointer; white-space: nowrap; text-decoration: none; position: relative; transition: background 0.15s; }
    .nav-item:hover { background: #f7f6fe; color: #534AB7; }
    .nav-item.active { background: #EEEDFE; color: #3C3489; font-weight: 600; }
    .nav-item svg { min-width: 18px; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }
    .nav-label { transition: opacity 0.15s; }
    .sidebar.collapsed .nav-label { opacity: 0; width: 0; overflow: hidden; }
    .sidebar-bottom { padding: 0 0.6rem; }
    .user-card { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem; border-radius: 8px; border: 1px solid #e8e8e8; background: #f7f6fe; overflow: hidden; }
    .avatar { min-width: 32px; width: 32px; height: 32px; border-radius: 50%; background: #EEEDFE; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #3C3489; flex-shrink: 0; }
    .user-info { overflow: hidden; transition: opacity 0.15s; }
    .user-info p { font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
    .user-info span { font-size: 0.75rem; color: #888; white-space: nowrap; }
    .sidebar.collapsed .user-info { opacity: 0; width: 0; }
    .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
    .mobile-overlay.visible { display: block; }
    .main { flex: 1; margin-left: 220px; transition: margin-left 0.25s ease; min-width: 0; }
    .main.expanded { margin-left: 60px; }
    .topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 30; }
    .topbar-left { display: flex; align-items: center; gap: 0.8rem; }
    .hamburger { display: none; width: 34px; height: 34px; border-radius: 6px; border: 1px solid #e8e8e8; background: transparent; cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
    .hamburger svg { width: 16px; height: 16px; stroke: #555; fill: none; stroke-width: 2; }
    .topbar h1 { font-size: 1.1rem; font-weight: 700; }
    .topbar p { font-size: 0.82rem; color: #888; margin-top: 2px; }
    .page-body { padding: 1.8rem 1.5rem; }
    .history-filters { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.82rem; border: 1px solid #e8e8e8; background: transparent; color: #666; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .filter-btn.active { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; font-weight: 600; }
    .history-list { display: flex; flex-direction: column; gap: 1rem; }
    .history-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 1.3rem; }
    .history-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; gap: 1rem; }
    .history-card-header h3 { font-size: 0.88rem; font-weight: 600; color: #534AB7; }
    .history-card-header span { font-size: 0.75rem; color: #aaa; white-space: nowrap; }
    .history-prompt { background: #f7f6fe; border-radius: 6px; padding: 0.7rem 1rem; margin-bottom: 0.8rem; }
    .history-prompt p { font-size: 0.82rem; color: #555; line-height: 1.5; }
    .history-prompt .label { font-size: 0.72rem; color: #888; font-weight: 600; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .history-response { border: 1px solid #e8e8e8; border-radius: 6px; padding: 0.7rem 1rem; }
    .history-response p { font-size: 0.82rem; color: #333; line-height: 1.6; max-height: 100px; overflow: hidden; position: relative; }
    .history-response p::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: linear-gradient(transparent, #fff); }
    .history-response .label { font-size: 0.72rem; color: #888; font-weight: 600; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .history-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
    .action-btn { padding: 0.35rem 0.8rem; border: 1px solid #e8e8e8; border-radius: 6px; font-size: 0.75rem; background: transparent; color: #555; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .action-btn:hover { background: #f7f6fe; border-color: #534AB7; color: #534AB7; }
    .empty-state { text-align: center; padding: 4rem 1rem; color: #888; }
    .empty-state p { font-size: 0.9rem; margin-top: 0.5rem; }
    .loading-spinner { width: 30px; height: 30px; border: 3px solid #EEEDFE; border-top-color: #534AB7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 3rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: 240px !important; transition: transform 0.25s ease; }
      .sidebar.mobile-open { transform: translateX(0); }
      .main { margin-left: 0 !important; }
      .hamburger { display: flex; }
      .topbar { padding: 0.9rem 1rem; }
      .page-body { padding: 1.2rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="sidebar-top">
          <a href="index.html" class="sidebar-logo">ProjectAI</a>
          <button class="toggle-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="Dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            <span class="nav-label">Dashboard</span>
          </a>
          <a href="Dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span class="nav-label">My Projects</span>
          </a>
          <a href="history.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="nav-label">History</span>
          </a>
          <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
            <span class="nav-label">Settings</span>
          </a>
          <a href="index.html" class="nav-item" style="color:#e53e3e;">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="nav-label">Log out</span>
          </a>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="avatar" id="userAvatar">AO</div>
          <div class="user-info">
            <p id="userName">Student</p>
            <span>Student plan</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main" id="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger" onclick="openSidebar()">
            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1>History</h1>
            <p>All your AI prompts and generated content</p>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="history-filters">
          <button class="filter-btn active" onclick="filterHistory('all', this)">All chapters</button>
          <button class="filter-btn" onclick="filterHistory('1', this)">Chapter 1</button>
          <button class="filter-btn" onclick="filterHistory('2', this)">Chapter 2</button>
          <button class="filter-btn" onclick="filterHistory('3', this)">Chapter 3</button>
          <button class="filter-btn" onclick="filterHistory('4', this)">Chapter 4</button>
          <button class="filter-btn" onclick="filterHistory('5', this)">Chapter 5</button>
          <button class="filter-btn" onclick="filterHistory('6', this)">References</button>
        </div>

        <div id="historyList" class="history-list">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://projectai-backend-production.up.railway.app';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const projectId = localStorage.getItem('projectId');

    if (!token) window.location.href = 'login.html';

    if (user.firstName) {
      document.getElementById('userName').textContent = user.firstName + ' ' + (user.lastName || '');
      document.getElementById('userAvatar').textContent = (user.firstName[0] + (user.lastName ? user.lastName[0] : '')).toUpperCase();
    }

    let allHistory = [];
    let currentFilter = 'all';

    const chapterNames = {
      1: 'Chapter 1 — Introduction',
      2: 'Chapter 2 — Literature Review',
      3: 'Chapter 3 — Methodology',
      4: 'Chapter 4 — Data Analysis',
      5: 'Chapter 5 — Conclusion',
      6: 'References'
    };

    function fetchHistory() {
      if (!projectId) {
        document.getElementById('historyList').innerHTML = `
          <div class="empty-state">
            <p>No project selected.</p>
            <p>Go back to your dashboard and open a project first.</p>
          </div>
        `;
        return;
      }

      fetch(API_URL + '/api/chapters/' + projectId + '/history', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.json())
      .then(data => {
        allHistory = data;
        renderHistory(currentFilter);
      })
      .catch(err => {
        document.getElementById('historyList').innerHTML = `
          <div class="empty-state">
            <p>Could not load history. Please try again.</p>
          </div>
        `;
      });
    }

    function renderHistory(filter) {
      const list = document.getElementById('historyList');
      const filtered = filter === 'all' ? allHistory : allHistory.filter(h => h.chapter_number == filter);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <p>No history yet.</p>
            <p>Your AI prompts and generated content will appear here.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filtered.map(h => `
        <div class="history-card">
          <div class="history-card-header">
            <h3>${chapterNames[h.chapter_number] || 'Chapter ' + h.chapter_number}</h3>
            <span>${formatDate(h.created_at)}</span>
          </div>
          <div class="history-prompt">
            <div class="label">Your prompt</div>
            <p>${h.user_prompt}</p>
          </div>
          <div class="history-response">
            <div class="label">AI response</div>
            <p>${h.ai_response ? h.ai_response.substring(0, 300) + '...' : 'No response saved'}</p>
          </div>
          <div class="history-actions">
            <button class="action-btn" onclick="copyResponse('${h.id}', \`${h.ai_response ? h.ai_response.replace(/`/g, "'") : ''}\`)">Copy response</button>
            <button class="action-btn" onclick="usePromptAgain('${h.user_prompt}')">Use prompt again</button>
          </div>
        </div>
      `).join('');
    }

    function filterHistory(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHistory(filter);
    }

    function formatDate(dateString) {
      if (!dateString) return 'Just now';
      const date = new Date(dateString);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + ' minutes ago';
      if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
      if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
      return date.toLocaleDateString();
    }

    function copyResponse(id, text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Response copied to clipboard!');
      }).catch(() => {
        alert('Copy failed. Please copy manually.');
      });
    }

    function usePromptAgain(prompt) {
      localStorage.setItem('reusePrompt', prompt);
      window.location.href = 'editor.html';
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main');
      sidebar.classList.toggle('collapsed');
      main.classList.toggle('expanded');
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('mobile-open');
      document.getElementById('mobileOverlay').classList.add('visible');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('mobileOverlay').classList.remove('visible');
    }

    fetchHistory();
  </script>

</body>
</html>
